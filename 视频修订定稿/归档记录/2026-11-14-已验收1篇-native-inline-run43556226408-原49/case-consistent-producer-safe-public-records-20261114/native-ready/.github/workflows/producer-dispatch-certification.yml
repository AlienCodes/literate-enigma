          ref: fc0b56af9a0ac0e97015548b756d4e51d66dc2ea
          path: official-main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /视频/工具/
            /视频/脚本/
            /视频/制作记录/
            /视频/音频核对/
            /视频/对照文本/
            /视频/资源/字体/
            /视频/配音缓存/*.json
            /最终版4K视频/27 - *
            /最终版4K视频/16 - *
            /新版定稿/
            /CLAUDE.md
            /视频/*.md
      - uses: actions/checkout@v4
        with:
          repository: alienalgorithm/postgraduate-vocabulary
