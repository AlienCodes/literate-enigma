      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: original-cache
        with:
          path: |
            ${{ runner.temp }}/completion-machine
            ~/asr
          key: completion-05-machine-43294745262
      - name: 确认恢复原机器缓存
        env:
          CACHE_HIT: ${{ steps.original-cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test -f "$RUNNER_TEMP/completion-machine/tts/kokoro-v1.0.onnx"
      - name: 安装原核查依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet -r official-main/视频/工具/环境/requirements.txt
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: 原快测与新模式真实认证
        run: python -u .github/producer-dispatch-certification/native-certify.py --variant '${{ matrix.variant }}'
      - name: 正常内部缓存固定16正确Origin原母与准确时长母
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/completion-machine/tts/cache_tts/dce6d1ce3af5043cfc8b6d30acf416eab118b916.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/dce6d1ce3af5043cfc8b6d30acf416eab118b916.pkl.单线程
            ${{ runner.temp }}/completion-machine/tts/cache_tts/989b1c025c09eacfd989962aef8352fba7637aa6.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/989b1c025c09eacfd989962aef8352fba7637aa6.pkl.单线程
          key: Linux-native16-origin-dce6d1-989b1c-${{ github.run_id }}
      - name: 记录正常内部cache保存成功
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          p=Path('certification-public/16-native-current-reference-cache.json')
          j=json.loads(p.read_text());j['normal_internal_Actions_cache_saved']=True
          j['normal_internal_Actions_cache_key']='Linux-native16-origin-dce6d1-989b1c-'+os.environ['GITHUB_RUN_ID']
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PYCODE
      - name: 仅上传认证日志与公开标量证据
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-producer-certification-${{ matrix.variant }}
          path: |
            certification-public/*.json
            certification-public/*.log
          retention-days: 30
          if-no-files-found: error
