name: 精确大小写分派与六程序完整快测
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/producer-dispatch-certification/**', '.github/workflows/producer-dispatch-certification.yml']
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [case-consistent-producer]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/producer-dispatch-certification
      - uses: actions/checkout@v4
