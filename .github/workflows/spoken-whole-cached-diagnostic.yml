name: 已认证17原缓存43及52整轨精确声域小诊断
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/spoken-whole-cached-diagnostic/**', '.github/workflows/spoken-whole-cached-diagnostic.yml']
permissions:
  contents: read
jobs:
  strict-whole-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/spoken-whole-cached-diagnostic
      - uses: actions/checkout@v4
        with:
          repository: alienalgorithm/postgraduate-vocabulary
          ref: fc0b56af9a0ac0e97015548b756d4e51d66dc2ea
          path: official-main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /视频/工具/
            /视频/配音缓存/*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: original-cache
        with:
          path: |
            ${{ runner.temp }}/completion-machine
            ~/asr
          key: completion-05-machine-43294745262
      - uses: actions/cache/restore@v4
        id: exact-six-mothers
        with:
          path: ${{ runner.temp }}/completion-machine/tts/spoken-comma-reference-cache
          key: Linux-three-spoken-comma-reference-43638178374
      - name: 两类原缓存必须真实命中
        env:
          OLD_HIT: ${{ steps.original-cache.outputs.cache-hit }}
          SIX_HIT: ${{ steps.exact-six-mothers.outputs.cache-hit }}
        run: |
          test "$OLD_HIT" = true
          test "$SIX_HIT" = true
          test -f "$RUNNER_TEMP/completion-machine/tts/kokoro-v1.0.onnx"
      - name: 安装原核查依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet -r official-main/视频/工具/环境/requirements.txt
      - name: 安装真正已认证17程序及原词典shadow上下文
        run: python .github/spoken-whole-cached-diagnostic/install_exact_certified17.py
      - name: 严格原缓存整轨复现及唯一原数学两新G36准备
        env:
          XG_NOPUSH: '1'
          STRICT_CACHE: '1'
          AUDIO_ONLY: '1'
          KEEP_REVIEWED_SOURCE_GAIN: '1'
          KEEP_REVIEWED_SOURCE_ENDING: '1'
          KEEP_REVIEWED_SOURCE_CUTS: '1'
        run: |
          python -u .github/spoken-whole-cached-diagnostic/spoken-whole-track-diagnostic.py --tools "$GITHUB_WORKSPACE/official-main/视频/工具" --video-root "$RUNNER_TEMP/completion-machine" --request43 "$GITHUB_WORKSPACE/.github/spoken-whole-cached-diagnostic/request/43" --request52 "$GITHUB_WORKSPACE/.github/spoken-whole-cached-diagnostic/request/52" --cache-contract "$GITHUB_WORKSPACE/.github/spoken-whole-cached-diagnostic/certified17/actual-six-spoken-mother-cache-contract.json" --output "$GITHUB_WORKSPACE/spoken-whole-public/strict-spoken-whole-track-diagnostic.json"
      - name: 私有保存六原母及两原算法数学JSON不导出PCM
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/completion-machine/tts/spoken-comma-whole-reference-cache
          key: Linux-spoken43-52-whole-reference-${{ github.run_id }}
      - name: 仅导出安全小标量不导母料GT音频
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spoken43-52-strict-cached-whole-track-diagnostic
          path: spoken-whole-public/*.json
          retention-days: 30
          if-no-files-found: error
