name: 已审增益与原始音频参考完整快测
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/keep-reviewed-gain-certification/**', '.github/workflows/keep-reviewed-gain-certification.yml']
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [keep-reviewed-gain]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/keep-reviewed-gain-certification
      - uses: actions/checkout@v4
        with:
          repository: alienalgorithm/postgraduate-vocabulary
          ref: fc0b56af9a0ac0e97015548b756d4e51d66dc2ea
          path: official-main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /视频/工具/
            /视频/脚本/
            /视频/制作记录/
            /视频/音频核对/
            /视频/对照文本/
            /视频/资源/字体/
            /视频/配音缓存/*.json
            /最终版4K视频/27 - *
            /新版定稿/
            /CLAUDE.md
            /视频/*.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: original-cache
        with:
          path: |
            ${{ runner.temp }}/completion-machine
            ~/asr
          key: completion-05-machine-43294745262
      - name: 确认恢复原机器缓存
        env:
          CACHE_HIT: ${{ steps.original-cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test -f "$RUNNER_TEMP/completion-machine/tts/kokoro-v1.0.onnx"
      - name: 安装原核查依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet -r official-main/视频/工具/环境/requirements.txt
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: 原快测与新模式真实认证
        run: python -u .github/keep-reviewed-gain-certification/native-certify.py --variant '${{ matrix.variant }}'
      - name: 仅上传认证日志与公开标量证据
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-gain-certification-${{ matrix.variant }}
          path: |
            certification-public/*.json
            certification-public/*.log
          retention-days: 30
          if-no-files-found: error
      - name: 独立分支保存公开认证证据
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERT_VARIANT: ${{ matrix.variant }}
        run: python .github/keep-reviewed-gain-certification/publish-native-certificate.py
