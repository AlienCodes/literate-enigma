name: 原48四处保声唯一候选原算法整轨实测
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/target48-whole-cached-diagnostic/**', '.github/workflows/target48-whole-cached-diagnostic.yml']
permissions:
  contents: read
jobs:
  prepare-name:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/target48-whole-cached-diagnostic
      - uses: actions/checkout@v4
        with:
          repository: alienalgorithm/postgraduate-vocabulary
          ref: fc0b56af9a0ac0e97015548b756d4e51d66dc2ea
          path: official-main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /视频/工具/
            /视频/配音缓存/*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: original-cache
        with:
          path: |
            ${{ runner.temp }}/completion-machine
            ~/asr
          key: completion-05-machine-43294745262
      - uses: actions/cache/restore@v4
        id: exact-new-name
        with:
          path: |
            ${{ runner.temp }}/completion-machine/tts/cache_tts/5277782c078c7fbb56cd99004114eaeae82ec430.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/5277782c078c7fbb56cd99004114eaeae82ec430.pkl.单线程
            ${{ runner.temp }}/completion-machine/tts/cache_tts/586bd56cd87532d8969be74dde574dc5ef09a448.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/586bd56cd87532d8969be74dde574dc5ef09a448.pkl.单线程
            ${{ runner.temp }}/completion-machine/tts/cache_tts/调平_55b4f1b37a71b4de9c91b384a2cee79d0d89761c.json
          key: Linux-native48-correctcontext-YuanLongping-43646876571
      - uses: actions/cache/restore@v4
        id: actual-whole-G36-3089
        with:
          path: ${{ runner.temp }}/completion-machine/tts/cache_tts/调平_3089bf1e9ad992be5bc42ea6c586ae366b1b1a40.json
          key: Linux-native48-correctcontext-whole-G36-3089-43649749759
      - name: 确认真正原数学whole3089缓存恢复
        env:
          CACHE_HIT: ${{ steps.actual-whole-G36-3089.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: 确认精确新全名私母已恢复
        env:
          CACHE_HIT: ${{ steps.exact-new-name.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: 确认原母模型缓存
        env:
          CACHE_HIT: ${{ steps.original-cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test -f "$RUNNER_TEMP/completion-machine/tts/kokoro-v1.0.onnx"
      - name: 安装原核查依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet -r official-main/视频/工具/环境/requirements.txt
      - name: 安装真正已认证五core原CUTS程序和实际110T
        run: python .github/target48-whole-cached-diagnostic/install_exact_core5.py
      - name: 恢复正式原native既有仓库别名上下文不改任何原母
        run: |
          python - <<'PYALIAS'
          from pathlib import Path
          import os,subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])/'official-main'
          alias=Path('/home/user/postgraduate-vocabulary')
          if not alias.exists():
              subprocess.run(['sudo','mkdir','-p',str(alias.parent)],check=True)
              subprocess.run(['sudo','ln','-s',str(root),str(alias)],check=True)
          assert alias.resolve()==root.resolve()
          assert (alias/'视频/工具/发音词典/读音改正.json').is_file()
          assert (alias/'视频/工具/发音词典/按语境读音.json').is_file()
          assert (alias/'视频/配音缓存/老条目指纹.json').is_file()
          PYALIAS
      - name: 原文件拷入临时工作目录
        env:
          XG_P: ${{ github.workspace }}/official-main
          XG_NOPUSH: '1'
        run: |
          python official-main/视频/工具/出片指纹.py --拷 "$RUNNER_TEMP/completion-machine/video"
      - name: 四处保声单候选整轨与唯一S9原数学实测
        id: target
        env:
          XG_NOPUSH: '1'
          STRICT_CACHE: '1'
          AUDIO_ONLY: '1'
          XG_KEEP_REVIEWED_GAIN: '1'
          XG_KEEP_REVIEWED_ENDING: '1'
          XG_KEEP_REVIEWED_CUTS: '1'
          VIDEO_ROOT: ${{ runner.temp }}/completion-machine
        run: |
          mkdir -p target48-whole-public
          python - <<'PYENV'
          import hashlib,os
          from pathlib import Path
          tools=Path(os.environ['GITHUB_WORKSPACE'])/'official-main/视频/工具/环境'
          work=Path(os.environ['RUNNER_TEMP'])/'completion-machine/video/环境'
          expected='dfde6c065a3558b74923ce82865a3b01dae1f839af4456b74de55dc3ff492312'
          assert hashlib.sha256((tools/'模型校验码.json').read_bytes()).hexdigest()==expected
          if work.exists():
              assert hashlib.sha256((work/'模型校验码.json').read_bytes()).hexdigest()==expected
          else:
              work.symlink_to(tools,target_is_directory=True)
          PYENV
          python -u .github/target48-whole-cached-diagnostic/native48_four_physical_protection_one_selected_whole_original_observer.py --tools "$GITHUB_WORKSPACE/official-main/视频/工具" --video-root "$RUNNER_TEMP/completion-machine" --request "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/48-selected-four-protection.json" --baseline-source "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/48-prior-actual295-physical-source0193.json" --cache-identity "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/48-correct-context-S15-mothers-and-actual-whole3089-private-cache-identity.json" --gain-decision "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/root-source48-real-whole3089-actual-gain-plus1-reconfirmation-decision.json" --whole-tuple-measurement "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/48-actual-whole-G36-3089-original-math-and-levels.json" --whole-reference "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/48-prior-actual295-whole-reference.json" --three-local-report "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/48-three-protection-local7a570.json" --S13-local-report "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/48-S13-protection-localbe565.json" --physical-selection "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/48-root-four-protection-physical-selection.json" --source-freeze "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/48-selected-four-protection-source-freeze.json" --output "$GITHUB_WORKSPACE/target48-whole-public/48-four-protection-one-selected-whole-original-scalar.json"
      - name: 只核真正成功新增的唯一S9原数学JSON并记录实际私缓存路径
        id: selected-S9-math
        if: success()
        run: |
          python - <<'PYSAVE'
          import os,json,hashlib
          from pathlib import Path
          O=Path(os.environ['GITHUB_WORKSPACE'])/'target48-whole-public'
          report=json.loads((O/'48-four-protection-one-selected-whole-original-scalar.json').read_text())
          assert report['diagnostic_completed'] and report['exact_scope_proved']
          row=report['phases']['selected_four_protection']['actual_new_S9_G51']
          assert row['actual_original_gains']=={}
          name=row['name'];assert Path(name).name==name and name.startswith('调平_')and name.endswith('.json')
          path=Path(os.environ['RUNNER_TEMP'])/'completion-machine/tts/cache_tts'/name
          assert hashlib.sha256(path.read_bytes()).hexdigest()==row['sha256']
          newly_written=row['cache_existed_before_original_function']is False
          assert row['original_math_derived_only_if_missing']==newly_written
          key='Linux-native48-four-protection-S9-G51-'+os.environ['GITHUB_RUN_ID'] if newly_written else None
          receipt={'kind':'actual-success-only-one-S9-original-math-private-cache-save-path','new_cache_saved_eligible':newly_written,'private_key':key,'original_saved_path':str(path)if newly_written else None,'filename':name,'SHA256':row['sha256'],'no_model_PCM_GT_or_other_cache_exported':True}
          (O/'48-actual-S9-only-private-cache-save-path.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a')as f:
              f.write('save='+str(newly_written).lower()+'\n')
              if newly_written:f.write('path='+str(path)+'\nkey='+key+'\n')
          PYSAVE
      - name: 仅私有保存本次真实新增S9调平JSON原单文件路径版本
        if: success() && steps.selected-S9-math.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.selected-S9-math.outputs.path }}
          key: ${{ steps.selected-S9-math.outputs.key }}
      - name: 同一次真实新整轨后只读原PV全tuple及原GT18独立report2
        if: always() && steps.target.outcome == 'success'
        env:
          XG_NOPUSH: '1'
          STRICT_CACHE: '1'
          AUDIO_ONLY: '1'
          XG_KEEP_REVIEWED_GAIN: '1'
          XG_KEEP_REVIEWED_ENDING: '1'
          XG_KEEP_REVIEWED_CUTS: '1'
        run: >-
          python -u .github/target48-whole-cached-diagnostic/native48_post_selected86a_original_PV_and_report2.py
          --tools "$GITHUB_WORKSPACE/official-main/视频/工具"
          --video-root "$RUNNER_TEMP/completion-machine"
          --request "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/48-selected-four-protection.json"
          --whole-observation "$GITHUB_WORKSPACE/target48-whole-public/48-four-protection-one-selected-whole-original-scalar.json"
          --cache-identity "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/48-correct-context-S15-mothers-and-actual-whole3089-private-cache-identity.json"
          --adapter "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/original48_reference_and_report2_after_selected86a_adapter.py"
          --main-code-adoption "$GITHUB_WORKSPACE/.github/target48-whole-cached-diagnostic/root-source48-selected-four-protection-one-whole-code-adoption-decision.json"
          --output-dir "$GITHUB_WORKSPACE/target48-whole-public/post-selected86a"
      - name: 仅保存安全标量JSON不导母料音频
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native48-four-protection-one-selected-whole-original-scalar
          path: |
            target48-whole-public/*.json
            target48-whole-public/post-selected86a/48-actual-new-whole-original-PV-full-tuples.json
            target48-whole-public/post-selected86a/48-same-native-post-original-PV-and-report2-scope.json
            target48-whole-public/post-selected86a/original-report2-safe-scalars/report2_48.json
            target48-whole-public/post-selected86a/original-report2-safe-scalars/report2_48.txt
            target48-whole-public/post-selected86a/original-report2-safe-scalars/48-original-reference-report2-observation.json
          retention-days: 30
          if-no-files-found: error
