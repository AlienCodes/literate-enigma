name: 目录42原48十二局部PV及两个HL原缓存标量核查
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/target48-whole-cached-diagnostic/**', '.github/workflows/target48-whole-cached-diagnostic.yml']
permissions:
  contents: read
jobs:
  prepare-name:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/target48-whole-cached-diagnostic
      - uses: actions/checkout@v4
        with:
          repository: alienalgorithm/postgraduate-vocabulary
          ref: fc0b56af9a0ac0e97015548b756d4e51d66dc2ea
          path: official-main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /视频/工具/
            /视频/配音缓存/*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: original-cache
        with:
          path: |
            ${{ runner.temp }}/completion-machine
            ~/asr
          key: completion-05-machine-43294745262
      - uses: actions/cache/restore@v4
        id: exact-new-name
        with:
          path: |
            ${{ runner.temp }}/completion-machine/tts/cache_tts/5277782c078c7fbb56cd99004114eaeae82ec430.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/5277782c078c7fbb56cd99004114eaeae82ec430.pkl.单线程
            ${{ runner.temp }}/completion-machine/tts/cache_tts/586bd56cd87532d8969be74dde574dc5ef09a448.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/586bd56cd87532d8969be74dde574dc5ef09a448.pkl.单线程
            ${{ runner.temp }}/completion-machine/tts/cache_tts/调平_55b4f1b37a71b4de9c91b384a2cee79d0d89761c.json
          key: Linux-native48-correctcontext-YuanLongping-43646876571
      - uses: actions/cache/restore@v4
        id: actual-whole-G36-3089
        with:
          path: ${{ runner.temp }}/completion-machine/tts/cache_tts/调平_3089bf1e9ad992be5bc42ea6c586ae366b1b1a40.json
          key: Linux-native48-correctcontext-whole-G36-3089-43649749759
      - name: 确认真正原数学whole3089缓存恢复
        env:
          CACHE_HIT: ${{ steps.actual-whole-G36-3089.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: 确认精确新全名私母已恢复
        env:
          CACHE_HIT: ${{ steps.exact-new-name.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - uses: actions/cache/restore@v4
        id: actual-S9-f172-original-single-file
        with:
          path: ${{ runner.temp }}/completion-machine/tts/cache_tts/调平_f17212ff25b6c3d8b0582cdfcfff978551a0ecac.json
          key: Linux-native48-four-protection-S9-G51-43663443133
      - name: 真读取f172原单文件版本不重算不换路径
        env:
          CACHE_HIT: ${{ steps.actual-S9-f172-original-single-file.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          python - <<'PYF172'
          from pathlib import Path
          import hashlib,os
          p=Path(os.environ['RUNNER_TEMP'])/'completion-machine/tts/cache_tts/调平_f17212ff25b6c3d8b0582cdfcfff978551a0ecac.json'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a'
          PYF172
      - name: 确认原母模型缓存
        env:
          CACHE_HIT: ${{ steps.original-cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test -f "$RUNNER_TEMP/completion-machine/tts/kokoro-v1.0.onnx"
      - name: 安装原核查依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet -r official-main/视频/工具/环境/requirements.txt
      - name: 安装真正已认证五core原CUTS程序和实际110T
        run: python .github/target48-whole-cached-diagnostic/install_exact_core5.py
      - name: 恢复正式原native既有仓库别名上下文不改任何原母
        run: |
          python - <<'PYALIAS'
          from pathlib import Path
          import os,subprocess
          root=Path(os.environ['GITHUB_WORKSPACE'])/'official-main'
          alias=Path('/home/user/postgraduate-vocabulary')
          if not alias.exists():
              subprocess.run(['sudo','mkdir','-p',str(alias.parent)],check=True)
              subprocess.run(['sudo','ln','-s',str(root),str(alias)],check=True)
          assert alias.resolve()==root.resolve()
          assert (alias/'视频/工具/发音词典/读音改正.json').is_file()
          assert (alias/'视频/工具/发音词典/按语境读音.json').is_file()
          assert (alias/'视频/配音缓存/老条目指纹.json').is_file()
          PYALIAS
      - name: 原文件拷入临时工作目录
        env:
          XG_P: ${{ github.workspace }}/official-main
          XG_NOPUSH: '1'
        run: |
          python official-main/视频/工具/出片指纹.py --拷 "$RUNNER_TEMP/completion-machine/video"
      - name: 严格原缓存全轨原声与新S15母实际身份诊断
        id: target
        env:
          XG_NOPUSH: '1'
          STRICT_CACHE: '1'
          AUDIO_ONLY: '1'
          XG_KEEP_REVIEWED_GAIN: '1'
          XG_KEEP_REVIEWED_ENDING: '1'
          XG_KEEP_REVIEWED_CUTS: '1'
          VIDEO_ROOT: ${{ runner.temp }}/completion-machine
        run: |
          mkdir -p target48-whole-public
          python - <<'PYENV'
          import hashlib,os
          from pathlib import Path
          tools=Path(os.environ['GITHUB_WORKSPACE'])/'official-main/视频/工具/环境'
          work=Path(os.environ['RUNNER_TEMP'])/'completion-machine/video/环境'
          expected='dfde6c065a3558b74923ce82865a3b01dae1f839af4456b74de55dc3ff492312'
          assert hashlib.sha256((tools/'模型校验码.json').read_bytes()).hexdigest()==expected
          if work.exists():
              assert hashlib.sha256((work/'模型校验码.json').read_bytes()).hexdigest()==expected
          else:
              work.symlink_to(tools,target_is_directory=True)
          PYENV
          python -u .github/target48-whole-cached-diagnostic/run_local513d_original_cached_scalar.py
      - name: 仅保存安全标量JSON不导母料音频
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native48-current513d-twelve-PV-two-HL-cached-scalar
          path: |
            target48-whole-public/*.json
          retention-days: 30
          if-no-files-found: error
