name: 书65唯一S11标准CMU2原声参数两母生成
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/source56-S11-CMU2-two-mother/**', '.github/workflows/source56-S11-CMU2-two-mothers.yml']
permissions:
  contents: read
jobs:
  only-S11-two-mothers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/source56-S11-CMU2-two-mother
      - uses: actions/checkout@v4
        with:
          repository: alienalgorithm/postgraduate-vocabulary
          ref: fc0b56af9a0ac0e97015548b756d4e51d66dc2ea
          path: official-main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /视频/工具/
            /视频/配音缓存/*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: original-cache
        with:
          path: |
            ${{ runner.temp }}/completion-machine
            ~/asr
          key: completion-05-machine-43294745262
      - name: 既有母音模型机器必须命中
        env:
          CACHE_HIT: ${{ steps.original-cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test -f "$RUNNER_TEMP/completion-machine/tts/kokoro-v1.0.onnx"
      - name: 安装原运行依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet -r official-main/视频/工具/环境/requirements.txt
      - uses: actions/cache/restore@v4
        id: actual-old-S11-mothers
        with:
          path: |
            ${{ runner.temp }}/completion-machine/tts/cache_tts/13ae7e344fdf2409fd9e771216e7192076890acd.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/13ae7e344fdf2409fd9e771216e7192076890acd.pkl.单线程
            ${{ runner.temp }}/completion-machine/tts/cache_tts/9b367dbd8656c1be8d5167b0c639ad5fad2c794b.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/9b367dbd8656c1be8d5167b0c639ad5fad2c794b.pkl.单线程
          key: Linux-native56-exact-S11-first-spoken-comma-43721094194
      - name: 原实际四叶cache版本必须命中，完整旧timed随后真实私读
        env:
          OLD_CACHE_HIT: ${{ steps.actual-old-S11-mothers.outputs.cache-hit }}
        run: test "$OLD_CACHE_HIT" = true
      - name: 仅安装本次真实新110程序印章与原词典上下文
        run: python .github/source56-S11-CMU2-two-mother/install_actual_certified22_context.py
      - name: 唯一S11新raw及timed原参数最多两模型调用
        id: target-mothers
        env:
          STRICT_CACHE: '1'
          XG_NOPUSH: '1'
          XG_KEEP_REVIEWED_GAIN: '1'
          XG_KEEP_REVIEWED_ENDING: '1'
          XG_KEEP_REVIEWED_CUTS: '1'
        run: python -u .github/source56-S11-CMU2-two-mother/run_target_only_two_mothers.py
      - name: 仅私有保存实际目标四个原cache文件不导母数组
        if: success() && steps.target-mothers.outputs.cache_key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.target-mothers.outputs.cache_paths }}
          key: ${{ steps.target-mothers.outputs.cache_key }}
      - name: 仅上传实际安全标量JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source56-S11-CMU2-two-mother-actual-scalar-only
          path: mother56-CMU2-public/*.json
          retention-days: 30
          if-no-files-found: error
