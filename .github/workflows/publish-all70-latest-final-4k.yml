name: Publish all70 actually complete latest4K finals
on:
  push:
    branches: [codex/all70-latest-final-4k-v1]
    paths: [.github/all70-latest-final-release/MANIFEST.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'alienalgorithm/postgraduate-vocabulary'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actual70 latest finals and publish unchanged ZIP
        run: python -u .github/all70-latest-final-release/publish_all70.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all70-latest-final-release-verification-${{ github.run_id }}
          path: all70-release-output/RELEASE-VERIFICATION.json
          if-no-files-found: warn
          retention-days: 30
