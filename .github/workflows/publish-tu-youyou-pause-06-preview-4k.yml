name: Publish reviewed Tu Youyou pause preview 4K review preview
on:
  push:
    branches: [codex/reviewed-tu-youyou-pause-06-preview-4k-v2]
    paths: [.github/tu-youyou-pause-06-preview-release/**, .github/workflows/publish-tu-youyou-pause-06-preview-4k.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'alienalgorithm/postgraduate-vocabulary'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archived preview bytes and publish one 4K video
        run: python -u .github/tu-youyou-pause-06-preview-release/publish_single.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tu-youyou-pause-06-preview-release-verification-${{ github.run_id }}
          path: single-release-output/RELEASE-VERIFICATION.json
          if-no-files-found: warn
          retention-days: 30
