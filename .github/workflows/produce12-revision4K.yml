name: 第12篇修订后原缓存正式4K
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/video12-revision/**', '.github/workflows/produce12-revision4K.yml']
permissions:
  contents: read
jobs:
  article12:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARTICLE_NO: '12'
      STRICT_CACHE: '1'
      XG_NOPUSH: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /.github/video12-revision/
            /.github/video-batch/
            /视频/工具/
            /视频/脚本/
            /视频/对照文本/12-*
            /视频/制作记录/
            /视频/音频核对/
            /视频/资源/字体/
            /视频/配音缓存/*.json
            /视频/*.md
            /新版定稿/
            /最终版4K视频/12 - *
            /CLAUDE.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: original-cache
        with:
          path: |
            ${{ runner.temp }}/completion-machine
            ~/asr
          key: completion-05-machine-43294745262
      - name: 确认原机器缓存已恢复
        env:
          CACHE_HIT: ${{ steps.original-cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test -f "$RUNNER_TEMP/completion-machine/tts/kokoro-v1.0.onnx"
      - name: 准备原有配音核查工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet -r 视频/工具/环境/requirements.txt
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/cache/restore@v4
        id: fastcheck-cache
        with:
          path: 视频/工具/新管/快测通过.json
          key: Linux-article05-fastcheck-v1-py311-original43294745262-99de41db540776b34faa8c3a8e9a5252c2327e43c2024a5428bc15245c688d3c
      - name: 确认真正通过的原快测印章已恢复
        env:
          STAMP_HIT: ${{ steps.fastcheck-cache.outputs.cache-hit }}
        run: test "$STAMP_HIT" = true
      - name: 原程序做12并定稿4K、逐字节保持既定AAC
        run: python -u .github/video12-revision/run.py
      - name: 只保存第12篇公开成片与核验材料
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article12-revised-canonical-4K-final
          path: |
            article12-delivery/*.mp4
            article12-delivery/*.json
            article12-delivery/*.png
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
