name: 书53原两母V3严格缓存整轨观测无新语音
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/source68-S2-strict-whole/**', '.github/workflows/source68-STRICT-cached-whole.yml']
permissions:
  contents: read
jobs:
  strict-cached-whole:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/source68-S2-strict-whole
      - uses: actions/checkout@v4
        with:
          repository: alienalgorithm/postgraduate-vocabulary
          ref: fc0b56af9a0ac0e97015548b756d4e51d66dc2ea
          path: official-main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /视频/工具/
            /视频/配音缓存/*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: original-cache
        with:
          path: |
            ${{ runner.temp }}/completion-machine
            ~/asr
          key: completion-05-machine-43294745262
      - name: 既有母音模型机器必须命中
        env:
          CACHE_HIT: ${{ steps.original-cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test -f "$RUNNER_TEMP/completion-machine/tts/kokoro-v1.0.onnx"
      - name: 安装原运行依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet -r official-main/视频/工具/环境/requirements.txt
      - name: 仅安装本次真实新110程序印章与原词典上下文
        run: python .github/source68-S2-strict-whole/install_actual_certified20_context.py
      - name: 安装已审S13真实原母输入语境到producer与checker两路径
        run: |
          python .github/source68-S2-strict-whole/apply_exact_existing_S13_context_data.py --tools "$GITHUB_WORKSPACE/official-main/视频/工具" --work "$RUNNER_TEMP/completion-machine/video" --context .github/source68-S2-strict-whole/inputs/source68-S13-context.json --adoption .github/source68-S2-strict-whole/inputs/root-source68-S13-context-adoption.json --output "$GITHUB_WORKSPACE/source68-strict-whole-public/actual-shared-S13-context-data-install.json"
      - uses: actions/cache/restore@v4
        id: selected-target-mothers
        with:
          path: |
            ${{ runner.temp }}/completion-machine/tts/cache_tts/957f2b32009a98dec0354ea08bc770a90a477c6d.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/957f2b32009a98dec0354ea08bc770a90a477c6d.pkl.单线程
            ${{ runner.temp }}/completion-machine/tts/cache_tts/ade031d5fbb2952cfc8aa8483ba9eef5751f2c08.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/ade031d5fbb2952cfc8aa8483ba9eef5751f2c08.pkl.单线程
          key: Linux-native68-exact-S2-first-spoken-comma-43702410293
      - name: 已实际保存的四叶缓存版本必须命中
        env:
          CACHE_HIT: ${{ steps.selected-target-mothers.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: 仅旧current及selected各一次严格缓存整轨观测
        id: whole-observer
        env:
          AUDIO_ONLY: '1'
          STRICT_CACHE: '1'
          XG_NOPUSH: '1'
          XG_KEEP_REVIEWED_GAIN: '1'
          XG_KEEP_REVIEWED_ENDING: '1'
          XG_KEEP_REVIEWED_CUTS: '1'
        run: python -u .github/source68-S2-strict-whole/run_strict_cached_whole.py
      - name: 仅保存实际通过全部恢复与strict回读的一个原数学JSON
        if: ${{ always() && steps.whole-observer.outputs.cache_key != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.whole-observer.outputs.cache_paths }}
          key: ${{ steps.whole-observer.outputs.cache_key }}
      - name: 仅上传实际安全标量JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source68-exactCTX-baseline-selected-whole-scalar-only
          path: source68-strict-whole-public/*.json
          retention-days: 30
          if-no-files-found: error
