name: release

# 发布 Windows 版到 GitHub Releases，两种触发方式：
#   1. 推送 v* 标签（例如 git push origin v0.1.0）；
#   2. 在 GitHub 网页 Actions → release → Run workflow，填写版本标签（例如 v0.1.0）。
#      标签不存在时，会在所选分支的最新提交上自动创建。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "版本标签（例如 v0.1.0），需与 pyproject.toml 里的版本号一致"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build Windows package
        run: |
          python -m pip install markdown-it-py mdit-py-plugins
          python scripts/build_windows_release.py --version "${TAG#v}" --notes dist/release_notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/*.zip)
          for pdf in dist/*.pdf; do
            case "$pdf" in
              *QuickStart*) assets+=("$pdf#快速上手（几页纸，先看这个）") ;;
              *) assets+=("$pdf") ;;
            esac
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "声音分身 VoiceTwin $TAG（Windows）" --notes-file dist/release_notes.md --latest
          fi
