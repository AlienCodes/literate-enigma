name: release

# 推送 v* 标签（例如 v0.1.0）时，自动打包 Windows 版并发布到 GitHub Releases。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（例如 v0.1.0，需已存在）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build Windows package
        run: |
          python -m pip install markdown-it-py mdit-py-plugins
          python scripts/build_windows_release.py --version "${TAG#v}" --notes dist/release_notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "声音分身 VoiceTwin $TAG（Windows）" --notes-file dist/release_notes.md --latest
          fi
