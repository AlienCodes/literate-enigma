name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -rf --junitxml=junit.xml
      # 失败时把每个没通过的测试写成注释（annotation），不用下载日志也能看到是哪个测试、为什么
      - name: Report failed tests
        if: failure()
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")  # Windows 的控制台是 cp1252：中文会让这一步自己出错
          try:
              root = ET.parse("junit.xml").getroot()
          except Exception as exc:
              print(f"::error title=junit.xml::{exc}")
              raise SystemExit(0)
          for case in root.iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  name = f"{case.get('classname')}.{case.get('name')}"
                  text = ((bad.get("message") or "") + " | " + (bad.text or "")[-1500:]).replace("%", "%25")
                  text = text.replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={name}::{text}")
