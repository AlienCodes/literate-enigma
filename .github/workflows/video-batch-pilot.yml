name: 70篇末页渲染试验
on:
  push:
    branches: [codex/batch70-render-20261112]
    paths: ['.github/video-batch/**', '.github/workflows/video-batch-pilot.yml']
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        article: ['50', '67', '69']
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: /.github/video-batch/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装轻量画面工具并取得只读原片
        run: |
          python -m pip install --quiet pillow==12.3.0 numpy==2.2.6
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          git fetch --no-tags --depth=1 --filter=blob:none origin c9d52b26fe981ef8e4c412189ca289716ab8bf00
          python -m py_compile .github/video-batch/run.py
      - name: 制作并核验
        run: python -u .github/video-batch/run.py '${{ matrix.article }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-${{ matrix.article }}
          path: completion-output/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

