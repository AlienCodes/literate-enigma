name: 37至48篇全文精修简述4K真实排版
on:
  push:
    branches: [codex/batch70-render-20261112]
    paths:
      - '.github/summary37-review/**'
      - '.github/workflows/review37-cards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/summary37-review
            视频/工具/render.py
            视频/工具/make_video.py
            视频/工具/fonts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 固定版本依赖和公开全文
        run: |
          python -m pip install numpy==2.4.6 pillow==12.3.0
          git fetch --filter=blob:none --depth=1 origin bd8e8fcd38877d407fa4284fc9088e7325307f12
          python -m py_compile .github/summary37-review/run.py
      - name: 逐张真实4K渲染和字符完整性核验
        run: python .github/summary37-review/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: fulltext-reviewed-37-48-cards
          path: .github/summary37-review/output/
          retention-days: 30
      - name: 保存公开排版报告和对照小图
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/summary37-review/output/layout-report.json .github/summary37-review/output/*-comparison.json
          git commit -m 'Verify revised 37–48 summary cards without changing video or audio'
          git pull --rebase origin codex/batch70-render-20261112
          git push origin HEAD:codex/batch70-render-20261112
