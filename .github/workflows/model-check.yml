# 一次性核对（2026-10-17）：本地带时长模型 kokoro-v1.0-timed.onnx（325505369 字节，sha256 beb0d1848dee9a49…）是不是 Hugging Face 上公开的那份。
# 这个容器连不上 Hugging Face，所以让 GitHub 机器去查各候选的文件清单（大小 + sha256），只查不下载。
name: model-check
on:
  push:
    branches: ['claude/adoring-hamilton-5qskmm']
    paths: ['.github/workflows/model-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in onnx-community/Kokoro-82M-v1.0-ONNX-timestamped onnx-community/Kokoro-82M-v1.0-ONNX; do
            curl -sS "https://huggingface.co/api/models/$r/tree/main/onnx" | python3 -c "
          import sys,json
          for e in json.load(sys.stdin):
              l=e.get('lfs') or {}
              print('$r', e['path'], l.get('size', e.get('size')), l.get('oid'), '✔ 与本地相同' if l.get('oid','').startswith('beb0d1848dee9a49') else '')"
          done
