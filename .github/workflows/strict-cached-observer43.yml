name: 原43严格既有母缓存局部检查及标量诊断
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/strict-cached-observer43/**', '.github/workflows/strict-cached-observer43.yml']
permissions:
  contents: read
jobs:
  strict-whole-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/strict-cached-observer43
      - uses: actions/checkout@v4
        with:
          repository: alienalgorithm/postgraduate-vocabulary
          ref: fc0b56af9a0ac0e97015548b756d4e51d66dc2ea
          path: official-main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /视频/工具/
            /视频/配音缓存/*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: original-cache
        with:
          path: |
            ${{ runner.temp }}/completion-machine
            ~/asr
          key: completion-05-machine-43294745262
      - uses: actions/cache/restore@v4
        id: exact-six-mothers
        with:
          path: ${{ runner.temp }}/completion-machine/tts/spoken-comma-whole-reference-cache
          key: Linux-spoken43-52-whole-reference-43643745207
      - name: 两类原缓存必须真实命中
        env:
          OLD_HIT: ${{ steps.original-cache.outputs.cache-hit }}
          SIX_HIT: ${{ steps.exact-six-mothers.outputs.cache-hit }}
        run: |
          test "$OLD_HIT" = true
          test "$SIX_HIT" = true
          test -f "$RUNNER_TEMP/completion-machine/tts/kokoro-v1.0.onnx"
      - name: 安装原核查依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet -r official-main/视频/工具/环境/requirements.txt
      - name: 安装真正已认证17程序及原词典shadow上下文
        run: python .github/strict-cached-observer43/install_exact_certified17.py
      - name: 恢复原生产词典别名与正常模块上下文
        env:
          XG_P: ${{ github.workspace }}/official-main
          XG_NOPUSH: '1'
        run: |
          sudo mkdir -p /home/user
          if [ ! -e /home/user/postgraduate-vocabulary ]; then sudo ln -s "$GITHUB_WORKSPACE/official-main" /home/user/postgraduate-vocabulary; fi
          test "$(readlink -f /home/user/postgraduate-vocabulary)" = "$GITHUB_WORKSPACE/official-main"
          python official-main/视频/工具/出片指纹.py --拷 "$RUNNER_TEMP/completion-machine/video"
          python - <<'PYENV'
          import os,hashlib,shutil
          from pathlib import Path
          T=Path(os.environ['GITHUB_WORKSPACE'])/'official-main/视频/工具/环境'
          W=Path(os.environ['RUNNER_TEMP'])/'completion-machine/video/环境'
          if not W.exists():W.symlink_to(T,target_is_directory=True)
          assert hashlib.sha256((W/'模型校验码.json').read_bytes()).hexdigest()=='dfde6c065a3558b74923ce82865a3b01dae1f839af4456b74de55dc3ff492312'
          for name,expected in {'读音改正.json':'5f558c61f8ffb99009a89989afcc07a9ce168b2b70a6c9377289040d14ec402b','按语境读音.json':'4d8905dc1a87f97b707270f03f41ea0fdf2b207ca218ed74608cdb134e3dc8e3'}.items():
              source=T.parent/'发音词典'/name
              target=W.parent/name
              assert hashlib.sha256(source.read_bytes()).hexdigest()==expected
              if target.exists():assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
              else:shutil.copyfile(source,target)
          PYENV
      - name: 只严格已有缓存实际观测不新推理不正式定稿
        env:
          XG_NOPUSH: '1'
          STRICT_CACHE: '1'
          AUDIO_ONLY: '1'
          XG_KEEP_REVIEWED_GAIN: '1'
          XG_KEEP_REVIEWED_ENDING: '1'
          XG_KEEP_REVIEWED_CUTS: '1'
        run: python .github/strict-cached-observer43/run_cached_observer.py
      - name: 仅私有保存已测候选原数学新调平JSON
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/completion-machine/tts/source43-one-NV-candidate-reference-cache
          key: Linux-source43-one-NV-candidate-reference-${{ github.run_id }}
      - name: 仅导实际安全标量JSON不导母音频
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source43-strict-cached-boundary-and-voice-scalar-diagnostic
          path: observer43-public/*.json
          retention-days: 30
          if-no-files-found: error
