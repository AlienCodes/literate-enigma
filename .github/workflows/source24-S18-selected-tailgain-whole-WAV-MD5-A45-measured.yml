name: 书49仅实测S18新母身份绑定及已选尾段增益原整轨两MD5标量
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/source24-S18-selected-tailgain-whole-WAV-MD5-A45-measured/**', '.github/workflows/source24-S18-selected-tailgain-whole-WAV-MD5-A45-measured.yml']
permissions:
  contents: read
jobs:
  strict-cached-whole:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/source24-S18-selected-tailgain-whole-WAV-MD5-A45-measured
      - uses: actions/checkout@v4
        with:
          repository: alienalgorithm/postgraduate-vocabulary
          ref: fc0b56af9a0ac0e97015548b756d4e51d66dc2ea
          path: official-main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /视频/工具/
            /视频/配音缓存/*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: original-cache
        with:
          path: |
            ${{ runner.temp }}/completion-machine
            ~/asr
          key: completion-05-machine-43294745262
      - name: 既有母音模型机器必须命中
        env:
          CACHE_HIT: ${{ steps.original-cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test -f "$RUNNER_TEMP/completion-machine/tts/kokoro-v1.0.onnx"
      - name: 安装原运行依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet -r official-main/视频/工具/环境/requirements.txt
      - name: 仅安装本次真实新110程序印章与原词典上下文
        run: python .github/source24-S18-selected-tailgain-whole-WAV-MD5-A45-measured/install_actual_certified20_context.py
      - uses: actions/cache/restore@v4
        id: selected-S18-mothers
        with:
          path: |
            ${{ runner.temp }}/completion-machine/tts/cache_tts/6ad3a3b41ce97d4b86f5bcd2cf23d997a661b81b.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/6ad3a3b41ce97d4b86f5bcd2cf23d997a661b81b.pkl.单线程
            ${{ runner.temp }}/completion-machine/tts/cache_tts/a89de4f946c6cfc5c23a98384b5f48a5e659038b.pkl
            ${{ runner.temp }}/completion-machine/tts/cache_tts/a89de4f946c6cfc5c23a98384b5f48a5e659038b.pkl.单线程
          key: Linux-native24-exact-S18-first-spoken-comma-43702270266
      - name: 已实际保存的四叶缓存版本必须命中
        env:
          CACHE_HIT: ${{ steps.selected-S18-mothers.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: 仅旧current及所选尾段增益各一次原整轨严格缓存复测
        env:
          AUDIO_ONLY: '1'
          STRICT_CACHE: '1'
          XG_NOPUSH: '1'
          XG_KEEP_REVIEWED_GAIN: '1'
          XG_KEEP_REVIEWED_ENDING: '1'
          XG_KEEP_REVIEWED_CUTS: '1'
        run: python -u .github/source24-S18-selected-tailgain-whole-WAV-MD5-A45-measured/run_strict_cached_whole.py
      - name: 仅上传实际安全标量JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source24-S18-selected-tailpiece2-gain-whole-scalar-only
          path: whole24-selected-tailgain-WAV-MD5-A45-bound-public/*.json
          retention-days: 30
          if-no-files-found: error
