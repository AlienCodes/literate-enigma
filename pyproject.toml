[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetwin"
version = "0.1.6"
description = "声音分身 VoiceTwin：用你自己的讲课录音/视频，复刻你的音色、语气和节奏（中文 + 英文）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "requests>=2.28",
    "librosa>=0.10",
    "pyloudnorm>=0.1.1",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0.0", "zhconv>=1.4"]
funasr = ["funasr>=1.1.0", "modelscope>=1.15"]
# resemblyzer 需要 webrtcvad；Windows 上用 webrtcvad-wheels 免编译，
# 然后执行 `pip install resemblyzer --no-deps`（安装脚本会自动完成）。
eval = ["torch>=2.0", "webrtcvad-wheels>=2.0.11"]
denoise = ["noisereduce>=3.0"]
# 精准声纹打分（"像你本人"百分比）：模型是 ONNX 格式，用 onnxruntime 在 CPU 上运行
sv = ["onnxruntime>=1.14"]
separate = ["demucs>=4.0"]
webui = ["gradio>=4.0"]
docx = ["python-docx>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
voicetwin = "voicetwin.cli:main"

[tool.setuptools.packages.find]
include = ["voicetwin*"]

[tool.setuptools.package-data]
voicetwin = ["backends/workers/*.py", "default_config.yaml", "eval/sv_cohort.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
