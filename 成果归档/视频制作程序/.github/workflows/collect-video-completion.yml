name: 收齐20篇简述成品并保存到任务分支
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/video-publish/request.json']
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/finish-05-and-summaries-20261112
          filter: blob:none
          sparse-checkout: /.github/video-publish/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43293230835
          pattern: video-*
          path: incoming
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43293544517
          pattern: video-19
          path: incoming
      - name: 获取只读原始基线
        run: git fetch --no-tags --depth=1 --filter=blob:none origin c9d52b26fe981ef8e4c412189ca289716ab8bf00
      - name: 核对20份成品并保存
        run: |
          python -m pip install --quiet pillow==12.3.0
          python -u .github/video-publish/publish.py
      - uses: actions/upload-artifact@v4
        with:
          name: 20-summary-pages-4K
          path: delivery/20篇简述补页_4K/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: summary-previews
          path: previews/
          if-no-files-found: error
          retention-days: 90
