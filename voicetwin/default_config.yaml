# =====================================================================
#  VoiceTwin 声音分身 —— 默认配置
#  用 `voicetwin init-config` 复制一份到当前目录的 config.yaml 再修改。
#  没写到的项会自动使用这里的默认值。
# =====================================================================

# 所有声音项目（素材、模型、输出）存放的根目录
workspace: ./workspace

# ---------------------------------------------------------------------
# 1. 素材准备：从你的讲课视频 / 录音里提取干净、带文字的语音片段
# ---------------------------------------------------------------------
prepare:
  sample_rate: 44100          # 片段统一采样率（训练时会按各引擎要求自动重采样）
  highpass_hz: 60             # 去掉 60Hz 以下的低频嗡嗡声（空调、桌面震动）
  denoise: auto               # off | auto | on  —— auto: 只在估计信噪比低于阈值时轻度降噪
  denoise_strength: 0.6       # 0~1，越大降噪越狠，但太大会损伤音色，建议 ≤0.7
  snr_threshold_db: 25        # auto 模式的降噪阈值
  separate_vocals: false      # 视频里有背景音乐时改成 true（需要安装 demucs）
  target_lufs: -20            # 片段统一响度
  segmentation: auto          # auto: 视频旁边有同名 .srt 字幕就按字幕切，否则按静音切 | srt | energy
  slicer:
    threshold_db: auto        # 静音判定阈值，auto 会根据底噪自动计算
    min_interval_ms: 300      # 至少这么长的停顿才会被当成可切分点
    hop_ms: 10
    max_sil_kept_ms: 400      # 片段两端最多保留的静音
  min_duration: 2.0           # 片段最短 / 最长秒数
  max_duration: 12.0
  asr:
    engine: faster-whisper    # faster-whisper（中英都好）| funasr（纯中文更准）| none（只用字幕）
    model: large-v3           # faster-whisper: large-v3 / large-v3-turbo / medium；funasr: paraformer-zh / iic/SenseVoiceSmall
    device: auto              # auto | cuda | cpu
    compute_type: auto        # auto | float16 | int8_float16 | int8
    language: auto            # auto（逐段自动识别）| zh | en
    initial_prompt_zh: "以下是普通话的句子，使用简体中文和标点符号。"
    beam_size: 5
  filter:
    min_avg_logprob: -1.0     # 识别置信度太低的片段丢掉（通常是含糊或识别错误）
    max_no_speech_prob: 0.6
    rate_outlier_low: 0.5     # 语速离中位数太远的片段（多半是文字对不上）丢掉
    rate_outlier_high: 1.8
    max_clip_ratio: 0.002     # 爆音（削波）样本比例上限
    speaker_outlier: true     # 用声纹剔除不是你本人的片段（学生提问、插入的视频等）
    speaker_min_similarity: auto
  validation_count: 20        # 留出多少条不参与训练、专门用来自动挑选最佳模型和校准"像你本人（%）"（素材少时自动减少）
  proofcheck: auto            # 素材准备最后自动"查找可能的错字"：auto（装了第二个识别引擎时才做）| on | off
  references:
    count: 8                  # 挑选多少条最具代表性的参考音频
    min_duration: 3.5         # GPT-SoVITS 要求参考音频 3~10 秒
    max_duration: 9.5

# ---------------------------------------------------------------------
# 2. 合成引擎
# ---------------------------------------------------------------------
backend: gptsovits            # gptsovits（推荐，微调后最像）| qwen3tts | indextts | dummy（测试用）

backends:
  gptsovits:
    root: ./third_party/GPT-SoVITS    # GPT-SoVITS 目录（Windows 整合包解压后的目录也可以）
    python: auto              # auto 会依次查找 runtime/python.exe、.venv、当前 Python
    version: v2ProPlus        # v2Pro | v2ProPlus（官方 2026 年推荐，接近 v4 的效果、v2 的速度）
    api_url: ""               # 如果你已经手动启动了 api_v2.py，填 http://127.0.0.1:9880，程序就不再自己启动
    port: 9880
    device: cuda
    is_half: true             # 显卡不支持半精度（如 10 系以前）改成 false
    startup_timeout: 600
    train:
      # 下面都写 auto 就行：电脑按显卡（显存）和素材多少自动决定，训练开始时会打印一行「训练计划：……」说明为什么。
      # 想自己指定时填数字（网页「② 训练模型」→「高级设置」、命令行 --sovits-epochs 等也可以临时改）。
      mode: auto              # 训练方式：auto（默认）= identical「一模一样」（练得更久、多存版本、第 4 轮以后存下的每个版本都试一遍再挑）
                              # | standard（和以前一样的训练量）。网页上每次打开都先选好「一模一样」，命令行用 --mode
      text_frontend: auto     # auto = 中文句子里夹着的英文也参加训练（不成功自动退回官方的方法）| official（官方的方法）
      batch_probe: auto       # 「一模一样」训练前先实测显卡一次能练几条（练几十步就停）；false = 不实测，按显存的公式算
      feature_parts: auto     # 提取特征分几路同时做：auto = 8GB 档以上 2 路，否则 1 路
      deep_sovits_epochs: 24  # 「一模一样」每批 4 条时：音色 24 轮、每 2 轮存一个；语气 20 轮、每轮存一个
      deep_gpt_epochs: 20     # （每批多练几条时轮数按比例加多，音色最多 48 轮、语气最多 50 轮）
      deep_sovits_save: 2
      deep_gpt_save: 1
      sovits_epochs: auto     # auto: 素材 <30 分钟用 8 轮，更多用 12 轮（练太多反而会变差，训练完会自动挑最像的那一轮）
                              # （这一行和下面几行写了数字时两种训练方式都照你写的）
      gpt_epochs: auto        # auto: 15 轮
      batch_size: auto        # auto: 按显存自动计算（显存一半左右，最多 12；显存不够时每次减 1 条接着练，最多减 3 次）
      sovits_save_every: auto # auto: 每个模型存 5 个左右，训练完从中自动挑最像你的（老版本的 4 / 5 也当作 auto）
      gpt_save_every: auto
      if_dpo: auto            # DPO（GPT-SoVITS 的实验功能）：auto = 不开（没有可靠的测量说明它能让声音更像）；
                              # true 手动打开（语气训练慢 2～4 倍，显存最好 ≥ 22GB，不够会出错），false 关
      text_low_lr_rate: 0.4
      gpu: "0"
    infer:
      top_k: 15
      top_p: 1.0
      temperature: 1.0
      repetition_penalty: 1.35
      aux_refs: 2             # 额外参考音频数量（v2/v2Pro：把几条参考的音色平均一下）。快速/均衡/最好用这个数；
                              # 极致/完美自动用 3 条（显存小于 8GB 用 2 条）。说实话：它几乎不占显存，效果提升也有限
      sample_steps: 32        # 仅 v3/v4 使用

  qwen3tts:
    python: auto
    repo: ./third_party/Qwen3-TTS     # 微调需要这个仓库里的 finetuning 脚本
    model: Qwen/Qwen3-TTS-12Hz-1.7B-Base   # 零样本克隆用的模型，也可以填本地目录；显存小用 0.6B-Base
    tokenizer: Qwen/Qwen3-TTS-Tokenizer-12Hz
    models_dir: ./third_party/models  # 微调需要的模型会自动下载到这里
    download_source: auto     # auto（先 HuggingFace 后 ModelScope）| hf | modelscope（国内推荐）
    device: cuda:0
    dtype: bfloat16
    attn: auto                # auto | flash_attention_2 | sdpa
    instruct: ""              # 仅 1.7B 微调模型：用自然语言描述语气，例如 "用耐心讲课的语气"
    startup_timeout: 900
    train:
      init_model: Qwen/Qwen3-TTS-12Hz-0.6B-Base  # 全量微调：0.6B 约需 12GB 显存；1.7B 建议 32GB 以上
      batch_size: 2
      lr: 2.0e-5
      epochs: 3

  indextts:
    root: ./third_party/index-tts
    python: auto
    model_dir: checkpoints
    version: "2.5"            # "2.5" 或 "2"
    half: true                # 2.5 用 bf16，2 用 fp16
    emo_alpha: 0.6            # 用参考音频本身作为情绪参考时的强度
    startup_timeout: 900

  dummy: {}

# ---------------------------------------------------------------------
# 3. 合成（生成讲课音频）
# ---------------------------------------------------------------------
synth:
  # 质量档位（越往下越慢；只是让出错更少、挑得更准，不会超过模型训练出来的水平，也做不到百分之百一样）：
  #   auto      默认 = identical「一模一样」（任何显卡都一样）
  #   fast      快速：每句只生成 1 次，最快；偶尔会有读错或不太像的句子
  #   balanced  均衡：每句生成 3 次，自动挑最像你的
  #   best      最好：每句生成 5 次，并用语音识别检查漏字、错字
  #   max       极致：每句生成 8 次（显存 <8GB 时 6 次）、识别校验一直开着、错字门槛更严，不够像的自动重做
  #   perfect   完美：每句 4 次一批地试，达到严格标准（错字率 ≤5%、像你本人 ≥99%、语速音高在你平时的范围内）就停，
  #             最多 20 次；挑长短最接近的参考音频；同时输出「未去杂音」「去杂音」两个版本并推荐更像你的那个（很慢）
  #   identical 一模一样：每句换几条参考录音、几种生成设置，引擎自检通过时一次同时生成好几个版本；每句至少 / 最多试几个
  #             按显卡分档（见下面 tiers.identical），挑出来的那个达到严格标准、并且再试也不更好时才停；
  #             同时输出「未去杂音」「去杂音」两个版本（最慢）
  # 网页每次打开都先选好「一模一样」（网页不看这一项）；命令行没写 -q 时按这一项，写了别的档位会提示一句。
  quality: auto               # auto（默认）= identical「一模一样」；fast | balanced | best | max | perfect | identical
  candidates: auto            # 每句生成几个候选再自动挑最像的；auto 跟随 quality（完美档是每批几个；一模一样档不看这一项，见 tiers.identical）
  max_units_zh: 50            # 每段最多多少个音节（汉字），太长会拆开合成
  max_units_en: 45            # 英文每段最多多少个音节
  min_units: 6                # 太短的句子会和下一句合并，避免一两个字单独合成不自然
  seed: 20240601
  speed: auto                 # 语速倍数。auto/1.0 = 和你原声一样（自动校准）；1.2 = 快 20%，0.85 = 慢 15%。
                              # 快慢由合成模型自己控制（只改时长，不改音高和音色）；句间停顿也按比例变长/变短。
                              # 太极端（超过 ±20%）会不自然，建议 0.85～1.15
  pauses: profile             # profile: 按你本人的停顿习惯插入停顿 | fixed
  fixed_pauses: { clause: 0.25, sentence: 0.55, paragraph: 1.1 }
  # 句子之间、开头和结尾永远是绝对的数字静音（全是 0），没有底噪；每句首尾的杂音会被切掉并淡入淡出
  loudness: profile           # profile: 匹配你原始录音的响度 | 具体数值如 -16 | off
  output_format: wav          # wav | mp3（mp3 压缩后静音处可能有极小的杂讯；要绝对静音请用 wav）
  subtitles: true             # 同时输出 .srt 字幕
  skip_code_blocks: true      # Markdown 讲稿里的 ``` 代码块不朗读
  asr_check: auto             # auto: quality=best/max/perfect/identical 时开启；用识别模型检查有没有漏字/多字
  asr_check_model: auto       # auto: 中文优先用整合包自带的 Paraformer（更准）；否则显存 ≥8GB 用 large-v3-turbo，更小用 small
  cer_retry_threshold: 0.15   # 均衡/最好：漏字/错字率超过它就重新生成（极致/完美有自己更严的门槛，见下面 tiers）
  max_retries: 2              # 均衡/最好：最多重做几轮
  min_wrong_chars: 2          # 只错 1 个字（多半是识别误差）不算读错，避免短句被反复重做
  # 各档位的细节都可以单独改，例如：
  #   max:     { candidates: 8, retry_rounds: 3, retry_candidates: 3, cer_retry_threshold: 0.10, aux_refs: 3 }
  #   perfect: { candidates: 4, max_candidates: 20, target_pct: 99, cer_target: 0.05, cer_retry_threshold: 0.08 }
  tiers:
    identical:                # 「一模一样」的细节，一般不用改（都写 auto 就行）
      batch: auto             # 每次同时生成几个版本：显存 ≥16GB 12 / 8GB 档 8 / 更小 2 / 没有 N 卡 1（合成引擎自检通过才同时生成）；
                              # auto 时开头 6 次请求在这个数和它的一半之间按实测的「每秒几个版本」选；显存不够自动减半
      min_candidates: auto    # 每句至少试几个：40 / 小显存 16 / 没有 N 卡 6
      max_candidates: auto    # 每句最多试几个：64 / 32 / 12（命令行 -n 也是改这个）
      refs_per_sentence: auto # 每句从参考录音库里挑几条参考录音：3 / 小显存 2 / 没有 N 卡 2
      # 上面四项可以写一个数（每种显卡都用它），也可以只改一种显卡，例如 { high: 100 }：没写的显卡还是用默认的
      aux_options: [3, 0]     # 每条参考配几条辅助参考（融合音色），两种都试
      plateau: 8              # 最近 8 个版本……
      plateau_eps: 0.02       # ……最高分涨不到 0.02，就算「再试也不更好」
      full_score_top: 12      # 每个版本先只用一个声纹模型快速打分，前 12 名（和每种组合最好的那个）再完整打分……
      full_score_max: 24      # ……每句最多完整打分 24 个（三个声纹模型 + 错字检查 + 音调）
      store_top_k: 6          # 每句留下最好的几个版本：重新生成时一起比；打分标准变了时不用显卡、按新标准重新排
      cer_target: { strong: 0.03, weak: 0.06 }
      cer_retry_threshold: { strong: 0.08, weak: 0.12 }
      search_target: p50      # 继续找的目标：你自己录音的中位水平（不受 similarity.target_pct 影响）
      pass_target: p25        # 算「达标」：不低于你自己录音的常见水平（下四分位）
      refine_tempo: true      # 挑出来的那个语速和你平时差得多时，同一个版本只改语速再生成一次（也一起比）
      pipeline: auto          # 一边生成一边打分（没有 N 卡时不用）
      judge_device: auto      # 有显卡版 onnxruntime、显卡还空 1.5 GB 以上、实测和处理器算出来的一样时，声纹打分用显卡；否则用处理器
      # 下面几项是「一模一样」后面几步才用的设置，这一版改了还不起作用
      speed_trick: auto       # 「语速 1.0001」自检：现在一直按 auto（自检通过才同时生成语速正好 1.0 的句子）
      continuity: true
      two_checkpoints: true
  score:                      # 给候选打分的权重：相似度为主，其它只做扣分
    speaker: 2.0              # "像你本人（%）"的权重
    cer: 1.0                  # 错字率权重（读错太多的候选会先被淘汰，这里只管细微差别）
    rate: 0.4                 # 语速偏差权重
    pitch: 0.2                # 音高偏差权重

# "像你本人（%）"：100% = 和你自己的真实录音一样像（用没参与训练的验证集片段校准）。
# 相似度是声纹模型自动打分，越高越像，但不是绝对精确，最终以耳朵为准。
similarity:
  models: auto                # auto: 精准声纹打分（下面 sv_models 里的几个模型 + 人声检测 + 陌生人声纹库，两头校准）；
                              # 这些模型没下载时，用 GPT-SoVITS 整合包自带的 ERes2NetV2 + resemblyzer；
                              # 都没有时用简易 MFCC（仅供参考）。也可以写成 eres2netv2,resemblyzer
  sv_models: auto             # 精准声纹打分用哪几个模型：auto = redimnet2-b6, eres2netv2-zh, eres2net-base-zh（备选 campplus-zh-en）
  model_dir: ./models/sv      # 这些模型放在哪里（voicetwin download-models --sv 下载，约 170 MB）
  device: auto                # 旧的 ERes2NetV2 用：auto | cuda | cpu（精准声纹打分固定用 CPU，不和 GPT-SoVITS 抢显存）
  min_pct: 85                 # 低于这个百分比的候选直接淘汰；整句都达不到时保留最好的一个并标红提醒
  filter: auto                # auto: 有可靠的声纹模型时才淘汰 | on | off
  target_pct: 99              # 「完美」档的目标：达到就提前停止（「一模一样」不看它，见 synth.tiers.identical）

# 素材准备时剔除"不是你本人"的片段用的声纹模型：auto 会依次尝试 resemblyzer → speechbrain → 简易 MFCC。
# 写成具体名字（例如 resemblyzer）时，"像你本人（%）"也只用这一个模型打分。
speaker_encoder: auto
