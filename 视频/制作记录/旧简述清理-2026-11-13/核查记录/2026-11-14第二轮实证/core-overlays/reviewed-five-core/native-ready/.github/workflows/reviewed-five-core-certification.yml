name: 已审声音与读音自检五程序完整快测
on:
  push:
    branches: [codex/finish-05-and-summaries-20261112]
    paths: ['.github/reviewed-five-core-certification/**', '.github/workflows/reviewed-five-core-certification.yml']
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [reviewed-five-core]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/reviewed-five-core-certification
      - uses: actions/checkout@v4
        with:
          repository: alienalgorithm/postgraduate-vocabulary
          ref: fc0b56af9a0ac0e97015548b756d4e51d66dc2ea
          path: official-main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /视频/工具/
            /视频/脚本/
            /视频/制作记录/
            /视频/音频核对/
            /视频/对照文本/
            /视频/资源/字体/
            /视频/配音缓存/*.json
            /最终版4K视频/27 - *
            /新版定稿/
            /CLAUDE.md
            /视频/*.md
      - uses: actions/checkout@v4
        with:
          repository: alienalgorithm/postgraduate-vocabulary
          ref: 64621068034f8b6e09836a6d97210a0e9b2f1ed6
          path: ending-reference-resources
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /视频/配音缓存/5f93aa786be55c461e644507810b77990fa6e4da.pkl
            /视频/配音缓存/37112da59e215ce16f6352f7f133828c39d090a8.pkl
            /视频/配音缓存/d233608ddca4ac20f4479b70e048ff0cbf2618e1.pkl
            /视频/配音缓存/f001d896b4f92b9577f10482c220ac067fbb426b.pkl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        id: original-cache
        with:
          path: |
            ${{ runner.temp }}/completion-machine
            ~/asr
          key: completion-05-machine-43294745262
      - name: 确认恢复原机器缓存
        env:
          CACHE_HIT: ${{ steps.original-cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test -f "$RUNNER_TEMP/completion-machine/tts/kokoro-v1.0.onnx"
      - name: 安装原核查依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet -r official-main/视频/工具/环境/requirements.txt
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: 原快测与新模式真实认证
        run: python -u .github/reviewed-five-core-certification/native-certify.py --variant '${{ matrix.variant }}'
      - name: 仅上传认证日志与公开标量证据
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-five-certification-${{ matrix.variant }}
          path: |
            certification-public/*.json
            certification-public/*.log
          retention-days: 30
          if-no-files-found: error
